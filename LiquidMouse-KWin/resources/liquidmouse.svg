<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Liquid Arrow Body -->
    <path d="M 14 10 C 14 10 38 32 38 34 C 38 36 29 37 27 38 C 26 39 36 51 35 53 C 34 55 29 57 27 56 C 25 55 17 42 16 41 C 15 40 8 47 7 46 C 6 45 14 10 14 10 Z" 
          fill="url(#liquidGrad)" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linejoin="round"
          stroke-linecap="round"/>
    <!-- Liquid Droplets Trail / Splash -->
    <circle cx="48" cy="46" r="6" fill="#00d2ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="56" cy="34" r="3.5" fill="#3a7bd5" stroke="#ffffff" stroke-width="1"/>
    <circle cx="42" cy="58" r="2.5" fill="#00d2ff" opacity="0.85"/>
  </g>
</svg>
